name: bftree

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]

jobs:
  check-fmt-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup component add rustfmt clippy 
      - run: cargo install -f cargo-fuzz
      # Temporarily allow warnings due to spdk feature disabled in benchmark.
      - run: cargo clippy --features "metrics-rt, tracing"
      - run: cargo clippy --features "metrics-rt-debug-all, tracing"
      - run: cargo clippy --features "metrics-rt-debug-timer, tracing"
      - run: cargo fmt --all -- --check
      - run: cd benchmark && cargo clippy
      - run: cd benchmark && cargo clippy --features "metrics-rt"
      - run: cd benchmark && cargo clippy --features "metrics-rt-debug-all"
      - run: cd benchmark && cargo clippy --features "metrics-rt-debug-timer"
      - run: cd fuzz && cargo clippy
      - run: cd fuzz && cargo fmt --all -- --check
      - run: cd fuzz && cargo build

  test_sans:
    needs: check-fmt-build
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup component add rust-src
      - run: rustup toolchain install nightly --component rust-src
      - run: sudo apt update && sudo apt install -y llvm-dev
      - run: echo "PATH=/usr/lib/llvm-14/bin:$PATH" >> $GITHUB_ENV
      - run: cargo test
      - name: Serial resource lifecycle checks
        run: env BFTREE_RESOURCE_CHECK=1 cargo test --release --lib resource_lifecycle -- --test-threads=1
      - name: Deterministic fuzz regressions
        run: cargo test --manifest-path fuzz/Cargo.toml --test regressions
      - run: >
          env ASAN_OPTIONS="detect_odr_violation=0" RUSTFLAGS="-Z sanitizer=address"
          cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu --tests
      - name: Fuzz regressions under ASan and leak detection
        run: >
          env ASAN_OPTIONS="detect_odr_violation=0:detect_leaks=1" RUSTFLAGS="-Zsanitizer=address"
          cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu
          --manifest-path fuzz/Cargo.toml --test regressions
      # Temporarily disabled
      # I believe it is a bug elsewhere, not from us.
      # - run: >
      #     env RUSTFLAGS="-Z sanitizer=memory"
      #     cargo test -Zbuild-std --target x86_64-unknown-linux-gnu --tests
      # Shuttle's atomics/platform shims require cfg(test); exclude integration targets.
      - run: >
          env RUST_BACKTRACE=1
          cargo test --lib --features "shuttle" --release shuttle_bf_tree_concurrent_operations
      - run: >
          env RUST_BACKTRACE=1
          cargo test --lib --features "shuttle" --release shuttle_cpr_snapshot_disk
      - run: >
          env RUST_BACKTRACE=1
          cargo test --lib --features "shuttle" --release shuttle_cpr_snapshot_cache_only
      - name: Modeled point histories and publication
        run: >
          cargo test --lib --features shuttle --release --
          tests::linearizability allocation_publication
          circular_buffer_tail_queries shuttle_visitors_retry
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: linearizability-schedules
          path: target/linearizability-schedules/
          if-no-files-found: ignore

  miri:
    needs: check-fmt-build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install nightly --component miri --component rust-src
      - run: cargo +nightly miri setup
      - name: Circular-buffer boundary and reuse fuzz regression under Miri
        run: >
          cargo +nightly miri test --manifest-path fuzz/Cargo.toml
          --test regressions circular_buffer_wrap_reuse_boundary_seeds
      # CPR handshake weak-memory litmus tests. Weak-memory emulation is on by
      # default (the meaningful configuration); seeds 0..3 match the controls
      # documented in the `cpr_handshake_miri` module in src/snapshot.rs.
      - name: CPR handshake Miri litmus tests
        run: |
          for seed in 0 1 2 3; do
            MIRIFLAGS="-Zmiri-seed=$seed" cargo +nightly miri test --lib snapshot::cpr_handshake_miri
          done